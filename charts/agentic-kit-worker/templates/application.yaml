apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}-worker}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-worker}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/worker]
          ports: [{name: health, containerPort: 8081}]
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8081"
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          livenessProbe:
            httpGet: {path: /ping, port: health}
          envFrom: [{secretRef: {name: {{ required "existingSecret required" .Values.existingSecret }}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 512Mi}
