AppName = "agentic-kit-worker"
AppCode = 101
RunMode = "${env:GIN_MODE:release}"

[HTTPServer]
Listen = "${env:LISTEN_ADDR:127.0.0.1:8081}"
ReadTimeout = 10000
WriteTimeout = 10000
IdleTimeout = 60000

[DB]
Driver = "PostgreSQL"
DSN = "${env:DATABASE_URL}"
AutoMigrate = false
MaxOpenConns = 20
MaxIdleConns = 5
ConnMaxIdleTime = 300

# Optional live model deltas. Use the same Redis connection and DB as the API
# to relay reasoning and content to SSE subscribers.
# [Redis]
# Addrs = ["127.0.0.1:6379"]
# DB = 0

[Worker]
Concurrency = "${env:WORKER_CONCURRENCY:4}"
Lease = "${env:WORKER_LEASE:30s}"
Poll = "${env:WORKER_POLL:1s}"
StreamFirstChunkTimeout = "${env:WORKER_STREAM_FIRST_CHUNK_TIMEOUT:5m}"
StreamIdleTimeout = "${env:WORKER_STREAM_IDLE_TIMEOUT:2m}"

# Optional allowlist restricting which environment variables Agent model apiKeyEnv
# and HTTP/MCP tool tokenEnv may read. Reserved platform credentials (DATABASE_URL,
# SANDBOX_CENTER_TOKEN, Evaluator.TokenEnv, etc.) are always denied for Agent configs.
# Recommended for multi-tenant production:
# [Credentials]
# AllowedEnvPrefixes = ["AGENTIC_MODEL_", "AGENTIC_TOOL_", "AGENTIC_MCP_"]
# AllowedEnvVars = []

[Compaction]
MaxInputBytes = "${env:COMPACTION_MAX_INPUT_BYTES:65536}"

# Pricing is frozen by the API in each Run. Do not add a [Pricing] section here;
# legacy worker pricing configuration is rejected at startup.

# Optional control-plane API connection used by on-demand skill loading (load_skill).
# Leave BaseURL empty if runs do not mount skills. TokenEnv names the environment
# variable holding the worker service credential allowed by API [Worker].AllowedServices.
[ControlPlane]
BaseURL = "${env:AGENTIC_API_URL:}"
TokenEnv = "${env:AGENTIC_API_TOKEN_ENV:AGENTIC_API_TOKEN}"

# Sandbox-backed goal evaluator. Leave BaseURL empty to keep the
# fail-closed UnavailableEvaluator. TokenEnv names the environment variable
# holding the credential; the secret value never enters configuration.
[Evaluator]
BaseURL = "${env:SANDBOX_CENTER_URL:}"
TokenEnv = "${env:SANDBOX_CENTER_TOKEN_ENV:SANDBOX_CENTER_TOKEN}"
